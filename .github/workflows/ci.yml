name: CI

# Every job here runs without Google Cloud credentials. That is the point: the
# offline suite uses a numpy-backed fake Earth Engine, so a contributor with no
# GCP account gets the same green run CI does. Anything needing real Earth
# Engine lives in integration.yml, which is deliberately off the critical path
# -- a required check that depends on a third-party API is red often enough
# that people learn to ignore it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check src tests
      - name: ruff format
        run: ruff format --check src tests
      - name: mypy
        # Scoped to the boundary layers. Every `ee.*` object is effectively
        # Any, so strict typing over solaris/gee would produce a pile of
        # `type: ignore` and find nothing.
        run: mypy src/solaris/core src/solaris/api

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,physics]"
      - name: Offline test suite
        # No credentials in the environment. If a test reaches the network it
        # fails here, which is the guarantee we want.
        run: pytest --cov=src/solaris --cov-report=term-missing --cov-report=xml
      - name: Coverage floor on the boundary layers
        # Deliberately not a repo-wide percentage: that number is dominated by
        # code which cannot run offline, so it would either be set uselessly
        # low or push people towards fake tests.
        run: |
          coverage report --include="src/solaris/core/*,src/solaris/api/windows.py,src/solaris/api/schemas.py,src/solaris/physics/*" --fail-under=70
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml

  frontend:
    # Builds the site and asserts the bundle budget. Two things this catches
    # that nothing else can:
    #
    #   1. The content routes must ship no three.js. Route-splitting makes that
    #      true; only a check keeps it true, because a stray import in a shared
    #      component would pull the 800 kB WebGL chunk into the main bundle and
    #      nothing about the rendered site would look wrong.
    #   2. The Validation and Models pages import evaluation artifacts at build
    #      time, so a schema change breaks the build here rather than rendering
    #      a blank figure in production.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/site/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend/site
      - name: Build
        run: npm run build
        working-directory: frontend/site
      - name: Bundle budget
        run: npm run budget
        working-directory: frontend/site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: src/solaris/api/static/
          retention-days: 7

  drift:
    # The anti-drift guarantee: the numbers the site displays must match the
    # committed artifacts. Needs both a build and Python, so it runs after the
    # frontend job and consumes its output rather than rebuilding.
    #
    # This exists because the failure mode is silent: regenerate a report,
    # forget to rebuild, and the deployed pages show figures the repository no
    # longer produces. Nothing about the build prevents that.
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: src/solaris/api/static/
      - run: pip install -e ".[dev]"
      - name: Site figures match the committed artifacts
        run: pytest tests/unit/test_frontend_artifacts.py -v

  evals:
    # Runs against the committed reference cache, so it needs no network. This
    # is what catches the model drifting away from published plant performance.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[evals]"
      - name: Validation harness
        run: python -m solaris.evals.harness --quiet
      - name: Summarise on the job page
        run: cat evals/reports/latest.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: evals/reports/

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # One supply-chain check, not five. Non-blocking for now so a fresh
      # advisory in a transitive dependency does not stop unrelated work.
      - run: pip-audit --skip-editable || true

  docker:
    # Builds and boots the image. This is the check that catches problems no
    # unit test can -- the relative StaticFiles path, for instance, only failed
    # when the process started outside the repo root.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: solaris:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot and probe
        run: |
          docker run -d --name solaris -p 8080:8080 \
            -e SOLARIS_ENV=ci -e GEE_PROJECT_ID=ci-placeholder solaris:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health; then break; fi
            sleep 2
          done
          echo
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS http://127.0.0.1:8080/api/version
          # /api/presets must answer even with no Earth Engine credentials:
          # the coverage probe falls back to a conservative bound rather than
          # taking the endpoint down.
          curl -fsS http://127.0.0.1:8080/api/presets > /dev/null
          echo "smoke checks passed"
      - name: Container logs on failure
        if: failure()
        run: docker logs solaris || true
