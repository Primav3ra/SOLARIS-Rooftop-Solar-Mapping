[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solaris"
version = "0.2.0"
description = "Rooftop solar PV yield mapping for urban India, from Earth Engine data"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Mehul Karwa" }]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]

# Runtime only. Verified against actual imports -- `pandas`, `numpy`,
# `matplotlib`, `seaborn`, `folium`, `jupyter`, `geopandas`, `geemap` and
# `requests` were all declared but imported nowhere, and `geopandas` alone
# pulled GDAL/Fiona/PROJ into the install.
dependencies = [
  "earthengine-api>=1.7,<2",
  "fastapi>=0.115,<1",
  "google-auth>=2.30,<3",   # imported directly on the ADC path
  "pydantic>=2.8,<3",       # imported directly; was only transitive before
  # 2.3 is the floor for NoDecode, which core/config.py needs so a
  # comma-separated SOLARIS_CORS_ORIGINS is not JSON-decoded before its
  # validator runs. Undeclared until now: it happened to be installed locally,
  # so every clean install -- including CI -- failed on import.
  "pydantic-settings>=2.3,<3",
  # Both imported directly by src/solaris, so both are declared rather than
  # relied on transitively. cachetools was previously supplied by google-auth,
  # which dropped it -- so a clean install lost the in-process cache backend
  # and /api/yield answered 500 on its first cache lookup. starlette arrives
  # with fastapi, but api/app.py and api/middleware.py import it by name.
  "cachetools>=5.3,<7",
  "starlette>=0.37,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
# Reference PV physics. Optional so the default serving path stays light --
# pvlib pulls numpy, pandas and scipy, none of which the legacy engine needs.
# solaris.physics.pv raises a clear PvlibUnavailableError if the pvlib engine
# is requested without this installed.
physics = [
  "pvlib>=0.11,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
]
# The ML tracks, which build on the physics layer.
ml = [
  "solaris[physics]",
  "scikit-learn>=1.5,<2",
  "lightgbm>=4.5,<5",
  "joblib>=1.4,<2",
  "pyarrow>=17,<22",
]
# The persistent cache tier and the shared Earth Engine budget counter.
# Optional so a local run needs no Google Cloud client library at all: without
# it the cache degrades to memory-only and says so through /api/config, rather
# than failing. solaris.core.firestore_cache names this extra in its error
# message, so the name here is part of that contract.
firestore = [
  "google-cloud-firestore>=2.19,<3",
]
# Validation harness: the ml stack plus reference-API access.
evals = [
  "solaris[ml]",
  "requests>=2.32,<3",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<8",
  "pytest-mock>=3.14,<4",
  "hypothesis>=6.100,<7",
  "httpx>=0.27,<1",
  # Upper bounds on the linters, deliberately. An open bound means CI installs
  # whatever released this morning, so a new rule turns the build red on code
  # nobody touched -- which happened: local 0.12 against 0.16 on a clean
  # install produced three failures. Raise these on purpose, not by surprise.
  # A tight bound, because ruff-format's output is version-sensitive: 0.12 and
  # 0.16 disagree on lambda wrapping, so a loose pin makes `ruff format --check`
  # fail in CI on code the developer just formatted.
  "ruff>=0.16,<0.17",
  "mypy>=1.11,<2",
  "pip-audit>=2.7",
  "pre-commit>=3.8",
]

[project.scripts]
solaris-api = "solaris.api.app:main"

[project.urls]
Repository = "https://github.com/Primav3ra/SOLARIS-Rooftop-Solar-Mapping"

[tool.hatch.build.targets.wheel]
packages = ["src/solaris"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "TID", "RUF"]
ignore = [
  "E501",    # line length is ruff-format's job
  "B008",    # FastAPI's Depends() in defaults is idiomatic
]

[tool.ruff.lint.flake8-tidy-imports]
# Absolute imports only. The old `try: from datasets import x / except
# ImportError: from scripts.datasets import x` shims existed precisely because
# the package was import-path dependent; this keeps them from coming back.
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]   # sys.path-free test scripts still print-and-assert

[tool.mypy]
# 3.12, although the project supports 3.11 from `requires-python`.
#
# numpy ships stubs written in PEP 695 syntax, which mypy cannot parse while
# targeting 3.11 -- and the error aborts the entire run, so anyone with the
# physics extra installed could not type-check at all.
#
# The 3.11 guarantee does not rest on this setting. It is enforced by
# tests/unit/test_packaging.py, which parses every source file against the
# 3.11 grammar, and by the CI test matrix, which executes the suite on 3.11.
python_version = "3.12"
# Typed at the boundaries only. Every `ee.*` object is effectively Any, so
# strict mode over solaris/gee would generate many `type: ignore`s and find
# nothing. solaris.core / solaris.api are where types pay.
files = ["src/solaris/core", "src/solaris/api"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Third-party packages that ship no type information. Listing them explicitly
# rather than setting ignore_missing_imports globally: a global setting would
# also silence a genuine typo in one of our own module paths.
#   ee.*            -- earthengine-api ships no stubs; every ee object is Any
#   google.auth.*   -- used on the ADC path
#   google.cloud.*  -- the Firestore client, imported lazily
#   cachetools.*    -- the in-process TTL cache
module = ["ee.*", "google.auth.*", "google.cloud.*", "cachetools.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy ships stubs written against Python 3.12 syntax (PEP 695 `type`
# statements), which mypy cannot parse while targeting 3.11 -- and 3.11 is the
# floor this project supports, so lowering the target is not optional. The
# error aborts the whole run, not just the numpy file.
#
# Skipping the import means numpy-typed values are Any here. That costs little:
# no module under solaris/core or solaris/api uses numpy directly.
module = ["numpy", "numpy.*", "pandas", "pandas.*", "pvlib", "pvlib.*"]
ignore_missing_imports = true
follow_imports = "skip"
# Values from these are Any under solaris/core and solaris/api, which costs
# nothing: no module there uses them directly.

[tool.pytest.ini_options]
# "." puts the repo root on sys.path so tests can import the shared fakes
# (tests.fakes.fake_ee) without any sys.path manipulation inside test files.
testpaths = ["tests"]
pythonpath = ["src", "."]
# Default run is offline: no Earth Engine credentials, no network. A fresh
# clone must get a green `pytest` with no GCP account.
addopts = "-m 'not gee and not network' --strict-markers -q"
markers = [
  "gee: requires live Earth Engine credentials",
  "network: requires internet access to a third-party API",
  "slow: takes more than a few seconds",
]

[tool.coverage.run]
source = ["src/solaris"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
